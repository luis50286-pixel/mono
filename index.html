<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLARO WEB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="login-card" class="card">
        <h2>Hakeo en Dos pasos</h2>
        <div id="error-msg" class="error-msg">Usuario o contraseña incorrectos</div>
        
        <div class="input-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="Ingresa tu usuario" onkeypress="handleLoginKeyPress(event)">
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" onkeypress="handleLoginKeyPress(event)">
        </div>

        <button onclick="login()">Cargar Codigo</button>
    </div>

    <div id="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <h3>CLARO WEB</h3>
                <span id="user-display" class="user-display"></span>
                <span id="typing-indicator" class="typing-indicator"></span>
            </div>
            <div class="header-actions">
                <button class="logout-btn" onclick="logout()">Salir</button>
                <button id="clear-btn" class="clear-btn" onclick="clearChat()">Vaciar Chat</button>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
        </div>

        <div id="emoji-picker" class="emoji-picker">
            <span onclick="addEmoji('😀')">😀</span>
            <span onclick="addEmoji('😂')">😂</span>
            <span onclick="addEmoji('😍')">😍</span>
            <span onclick="addEmoji('👍')">👍</span>
            <span onclick="addEmoji('🔥')">🔥</span>
            <span onclick="addEmoji('🎉')">🎉</span>
            <span onclick="addEmoji('❤️')">❤️</span>
            <span onclick="addEmoji('😎')">😎</span>
            <span onclick="addEmoji('😘')">😘</span>
            <span onclick="addEmoji('🚥')">🚥</span>
            <span onclick="addEmoji('💖')">💖</span>
            <span onclick="addEmoji('🤷‍♂️')">🤷‍♂️</span>
            <span onclick="addEmoji('🥰')">🥰</span>
            <span onclick="addEmoji('😧')">😧</span>
        </div>

        <div class="chat-input-wrapper">
            <div class="chat-input">
                <button type="button" class="icon-btn" onclick="toggleEmojiPicker()">😀</button>
                
                <label for="file-input" class="icon-btn file-label" title="Adjuntar foto o video">🗂️</label>
                <input type="file" id="file-input" accept="image/*,video/*" style="display: none;" onchange="handleFileUpload(event)">

                <input type="text" id="message-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)" oninput="handleTyping()">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

            apiKey: "AIzaSyBamBFLFRoBq0g1A0IIGOIJ5ucjYqPrrW0",

        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();
    </script>

    <script src="script.js"></script>
</body>
</html>
