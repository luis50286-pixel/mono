<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLARO WEB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="login-card" class="card">
        <h2>Hakeo en Dos pasos</h2>
        <div id="error-msg" class="error-msg">Usuario o contraseña incorrectos</div>
        
        <div class="input-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="Ingresa tu usuario" onkeypress="handleLoginKeyPress(event)">
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" onkeypress="handleLoginKeyPress(event)">
        </div>

        <button onclick="login()">Cargar Codigo</button>
    </div>

    <div id="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <h3>CLARO WEB</h3>
                <span id="user-display" class="user-display"></span>
                <span id="typing-indicator" class="typing-indicator"></span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="clearChat()" title="Vaciar chat">🗑️</button>
                <button class="logout-btn" onclick="logout()">Salir</button>
            </div>
        </div>

        <div id="chat-messages" class="chat-messages"></div>

        <div class="chat-footer">
            <div id="emoji-picker" class="emoji-picker">
                <span onclick="addEmoji('😀')">😀</span>
                <span onclick="addEmoji('😂')">😂</span>
                <span onclick="addEmoji('❤️')">❤️</span>
                <span onclick="addEmoji('👍')">👍</span>
                <span onclick="addEmoji('🔥')">🔥</span>
                <span onclick="addEmoji('🎉')">🎉</span>
            </div>

            <div class="input-bar">
                <button class="icon-btn" onclick="toggleEmojiPicker()" title="Emojis">😊</button>

                <label for="file-input" class="icon-btn file-label" title="Adjuntar foto o video">🗂️</label>
                <input type="file" id="file-input" accept="image/*,video/*" style="display: none;" onchange="handleFileUpload(event)">

                <input type="text" id="message-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)" oninput="handleTyping()">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBamBFLFRoBq0g1A0IIGOIJ5ucjYqPrrW0",
            authDomain: "web-claro-dcc1a.firebaseapp.com",
            databaseURL: "https://web-claro-dcc1a-default-rtdb.firebaseio.com",
            projectId: "web-claro-dcc1a",
            storageBucket: "web-claro-dcc1a.firebasestorage.app",
            messagingSenderId: "472283086780",
            appId: "1:472283086780:web:48a7bcf14890c2fb39a1c6"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const database = firebase.database();
        const storage = firebase.storage();

        // Registrar Service Worker para notificaciones móviles
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registrado con éxito', reg))
                .catch(err => console.error('Error al registrar Service Worker', err));
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
