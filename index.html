<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLARO WEB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="login-card" class="card">
        <h2>Unirse al Chat</h2>
        <div id="error-msg" class="error-msg">Por favor ingresa un nombre para continuar</div>
        <div class="input-group">
            <label for="username">Tu Nombre / Apodo</label>
            <input type="text" id="username" placeholder="Ej. Carlos, María, Anónimo..." onkeypress="handleLoginKeyPress(event)">
        </div>
        <button onclick="login()">Entrar al Chat</button>
    </div>

    <div id="chat-container">
        <div class="chat-header">
            <h3>CLARO WEB</h3>
            <span id="user-display" class="user-display"></span>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message received">
                <span class="user-name">Sistema</span>
                ¡Bienvenido a la sala de chat!
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="message-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBamBFLFRoBq0g1A0IIGOIJ5ucjYqPrrW0",
            authDomain: "web-claro-dcc1a.firebaseapp.com",
            databaseURL: "https://web-claro-dcc1a-default-rtdb.firebaseio.com",
            projectId: "web-claro-dcc1a",
            storageBucket: "web-claro-dcc1a.firebasestorage.app",
            messagingSenderId: "454304195343",
            appId: "1:454304195343:web:858b54705ea63cd3ef147a",
            measurementId: "G-YF8NG7MB7C"
        };

        // Inicializar Firebase en la aplicación
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
    </script>

    <script src="script.js"></script>
</body>
</html>
